apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warpgate
resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - redis.yaml
  - application.yaml
  - release-agent.yaml
configMapGenerator:
  - name: release-agent-code
    files:
      - agent.py=agent/agent.py
