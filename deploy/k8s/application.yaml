apiVersion: apps/v1
kind: Deployment
metadata:
  name: warpgate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: warpgate
  template:
    metadata:
      labels:
        app: warpgate
    spec:
      initContainers:
        - name: wait-postgres
          image: ghcr.io/holyoke/warpgate@sha256:595caeb6d674da9d06916b57c065abedb863804fc27ba3eefff31ea8656d6e32
          command:
            - /bin/sh
            - -ec
            - until psql -h postgres -U warpgate -d warpgate -Atqc 'SELECT 1' >/dev/null 2>&1; do sleep 3; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: warpgate-secrets
                  key: POSTGRES_PASSWORD
        - name: wait-redis
          image: redis:7-alpine
          command:
            - /bin/sh
            - -ec
            - until [ "$(redis-cli -h redis ping 2>/dev/null)" = PONG ]; do sleep 3; done
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: warpgate-secrets
                  key: REDIS_PASSWORD
      containers:
        - name: warpgate
          image: ghcr.io/holyoke/warpgate@sha256:595caeb6d674da9d06916b57c065abedb863804fc27ba3eefff31ea8656d6e32
          envFrom:
            - secretRef:
                name: warpgate-secrets
          env:
            - { name: AUTO_SETUP, value: 'true' }
            - { name: SERVER_HOST, value: '0.0.0.0' }
            - { name: SERVER_PORT, value: '8080' }
            - { name: SERVER_MODE, value: release }
            - { name: RUN_MODE, value: standard }
            - { name: TZ, value: Asia/Shanghai }
            - { name: DATABASE_HOST, value: postgres }
            - { name: DATABASE_PORT, value: '5432' }
            - { name: DATABASE_USER, value: warpgate }
            - { name: DATABASE_DBNAME, value: warpgate }
            - { name: DATABASE_SSLMODE, value: disable }
            - { name: DATABASE_MAX_OPEN_CONNS, value: '50' }
            - { name: DATABASE_MAX_IDLE_CONNS, value: '10' }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warpgate-secrets
                  key: POSTGRES_PASSWORD
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1500m'
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
---
apiVersion: v1
kind: Service
metadata:
  name: warpgate
spec:
  type: NodePort
  selector:
    app: warpgate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30488
