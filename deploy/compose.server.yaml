services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE required}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      AUTO_SETUP: 'true'
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      RUN_MODE: standard
      TZ: Asia/Shanghai
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USER: warpgate
      DATABASE_DBNAME: warpgate
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: '50'
      DATABASE_MAX_IDLE_CONNS: '10'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, '5', -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warpgate
      POSTGRES_DB: warpgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warpgate -d warpgate']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?required}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  app_data:
  postgres_data:
  redis_data:
